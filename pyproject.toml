[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-tracker"
version = "1.0.0"
description = "Журнал запросов на изменение с историей и связью с Git-коммитами"
requires-python = ">=3.10"

[project.scripts]
change-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
