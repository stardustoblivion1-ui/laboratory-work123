[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-ci"
version = "1.0.0"
description = "Складской учёт на SQLite с CI"
requires-python = ">=3.10"

[project.scripts]
warehouse = "warehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
