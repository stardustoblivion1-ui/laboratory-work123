[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-tasks"
version = "1.0.0"
description = "Консольный менеджер командных задач (SQLite)"
requires-python = ">=3.10"

[project.scripts]
team-tasks = "taskman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
