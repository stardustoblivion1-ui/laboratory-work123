[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-version-manager"
version = "1.0.0"
description = "Локальный менеджер версий текстовых документов"
requires-python = ">=3.10"

[project.scripts]
fvm = "fvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
