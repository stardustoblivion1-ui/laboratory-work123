[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-auditor"
version = "1.0.0"
description = "Конфигурируемый аудитор соблюдения правил проекта"
requires-python = ">=3.11"

[project.scripts]
config-auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
