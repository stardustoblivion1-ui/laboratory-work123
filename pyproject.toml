[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-control"
version = "1.0.0"
description = "Контроль конфигурации файлов проекта: baseline, сканер, отчёт о расхождениях"
requires-python = ">=3.10"

[project.scripts]
config-control = "cfgctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
