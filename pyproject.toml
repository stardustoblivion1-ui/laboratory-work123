[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-platform"
version = "1.0.0"
description = "Интегрированная платформа управления конфигурацией проектов (SQLite + CLI)"
requires-python = ">=3.10"

[project.scripts]
scm-platform = "scmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
