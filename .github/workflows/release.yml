name: Release build

# Запускается ТОЛЬКО при публикации Git-тега формата v*
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      # 1) проверка ДО сборки: при несоответствии job падает, артефакты не создаются
      - name: Verify tag matches pyproject version
        run: relman check-tag "${GITHUB_REF_NAME}"
      - name: Run tests
        run: pytest -v
      # 2) сборка выполняется только после успешной проверки
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
