name: Audit and tests

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна полная история для подсчёта коммитов
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: ruff check .
      - run: pytest -v
      - name: Self-audit
        run: auditor audit . --rules rules.json --json audit.json --html audit.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-reports
          path: |
            audit.json
            audit.html
